name: Behavior or packaging bug
description: Report incorrect triggering, safety decisions, installation, or validation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Token Todo. Remove credentials, private source, account identifiers, and exact billing data before submitting.
  - type: textarea
    id: prompt
    attributes:
      label: Minimal prompt or installation step
      description: Provide the smallest public example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Agent host and version
      placeholder: Codex, Claude Code, Cursor, or another Agent Skills host
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model, if behavior-related
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant output, scenario result, or a minimal diff. Do not include credentials or private code.
